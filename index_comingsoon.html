<?php
// PHP SCRIPT START - For handling email sign-up
$message = '';
$message_class = '';
// *** IMPORTANT: CHANGE THIS TO YOUR ACTUAL EMAIL ***
$recipient_email = 'info@shanvitoursandtravels.com'; 

if ($_SERVER["REQUEST_METHOD"] == "POST" && isset($_POST['email'])) {
    $email = filter_var(trim($_POST['email']), FILTER_SANITIZE_EMAIL);

    if (filter_var($email, FILTER_VALIDATE_EMAIL)) {
        // Compose the email
        $subject = "New Coming Soon Page Subscriber";
        $body = "A new user has subscribed: " . $email;
        $headers = "From: noreply@" . parse_url($_SERVER['HTTP_HOST'], PHP_URL_HOST);

        if (mail($recipient_email, $subject, $body, $headers)) {
            $message = "Thank you! We'll notify you when we launch your travel adventures.";
            $message_class = "alert-success";
        } else {
            $message = "Sorry, there was an issue. Please try again or email us directly.";
            $message_class = "alert-danger";
        }
    } else {
        $message = "Please enter a valid email address.";
        $message_class = "alert-warning";
    }
}
// PHP SCRIPT END
?>
